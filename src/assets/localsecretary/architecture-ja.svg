<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="760" rx="24" fill="#f8fafc"/>
  <text x="64" y="66" font-size="34" font-weight="700" fill="#0f172a">Local Secretary — 全体構成</text>
  <text x="64" y="102" font-size="19" fill="#475569">すべてノートPC 1台のローカルで完結し、データは外部に出ません</text>
  <text x="1100" y="102" font-size="17" fill="#475569" text-anchor="middle">見る・指示する ↓</text>

  <!-- Column 1: Inputs -->
  <g>
    <rect x="64" y="140" width="250" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M64 156 a16 16 0 0 1 16 -16 h218 a16 16 0 0 1 16 16 v34 h-250 z" fill="#0284c7"/>
    <text x="189" y="173" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">入力</text>
    <rect x="84" y="210" width="210" height="56" rx="10" fill="#f1f5f9"/>
    <text x="189" y="245" font-size="18" fill="#0f172a" text-anchor="middle">講義の録音</text>
    <rect x="84" y="280" width="210" height="56" rx="10" fill="#f1f5f9"/>
    <text x="189" y="315" font-size="18" fill="#0f172a" text-anchor="middle">メール</text>
    <rect x="84" y="350" width="210" height="56" rx="10" fill="#f1f5f9"/>
    <text x="189" y="385" font-size="18" fill="#0f172a" text-anchor="middle">予定・締切</text>
    <rect x="84" y="420" width="210" height="56" rx="10" fill="#f1f5f9"/>
    <text x="189" y="455" font-size="18" fill="#0f172a" text-anchor="middle">メモ・指示</text>
  </g>

  <!-- Column 2: Ledger -->
  <g>
    <rect x="354" y="140" width="270" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M354 156 a16 16 0 0 1 16 -16 h238 a16 16 0 0 1 16 16 v34 h-270 z" fill="#7c3aed"/>
    <text x="489" y="173" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">台帳と記憶（Obsidian）</text>
    <rect x="374" y="210" width="230" height="56" rx="10" fill="#f1f5f9"/>
    <text x="489" y="245" font-size="18" fill="#0f172a" text-anchor="middle">Profile（長期記憶）</text>
    <rect x="374" y="280" width="230" height="56" rx="10" fill="#f1f5f9"/>
    <text x="489" y="315" font-size="18" fill="#0f172a" text-anchor="middle">Future（未来）</text>
    <rect x="374" y="350" width="230" height="56" rx="10" fill="#f1f5f9"/>
    <text x="489" y="385" font-size="18" fill="#0f172a" text-anchor="middle">Commitments（約束）</text>
    <rect x="374" y="420" width="230" height="56" rx="10" fill="#f1f5f9"/>
    <text x="489" y="455" font-size="18" fill="#0f172a" text-anchor="middle">Daily / Inbox / Queue</text>
    <text x="489" y="505" font-size="15" fill="#64748b" text-anchor="middle">正データは Markdown</text>
  </g>

  <!-- Column 3: Engine -->
  <g>
    <rect x="664" y="140" width="280" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M664 156 a16 16 0 0 1 16 -16 h248 a16 16 0 0 1 16 16 v34 h-280 z" fill="#d97706"/>
    <text x="804" y="173" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">秘書エンジン</text>
    <rect x="684" y="210" width="240" height="48" rx="10" fill="#f1f5f9"/>
    <text x="804" y="240" font-size="17" fill="#0f172a" text-anchor="middle">朝の点検（7:00）</text>
    <rect x="684" y="268" width="240" height="48" rx="10" fill="#f1f5f9"/>
    <text x="804" y="298" font-size="17" fill="#0f172a" text-anchor="middle">夜間バッチ（23:30）</text>
    <rect x="684" y="326" width="240" height="48" rx="10" fill="#f1f5f9"/>
    <text x="804" y="356" font-size="17" fill="#0f172a" text-anchor="middle">週次ホライズンスキャン</text>
    <rect x="684" y="384" width="240" height="48" rx="10" fill="#f1f5f9"/>
    <text x="804" y="414" font-size="15" fill="#0f172a" text-anchor="middle">講義取り込み・メール振り分け</text>
    <rect x="684" y="442" width="240" height="48" rx="10" fill="#f1f5f9"/>
    <text x="804" y="472" font-size="17" fill="#0f172a" text-anchor="middle">判断は Qwen の単発ジョブ</text>
  </g>

  <!-- Column 4: Platform -->
  <g>
    <rect x="984" y="140" width="232" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M984 156 a16 16 0 0 1 16 -16 h200 a16 16 0 0 1 16 16 v34 h-232 z" fill="#059669"/>
    <text x="1100" y="173" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">プラットフォーム</text>
    <rect x="1004" y="210" width="192" height="56" rx="10" fill="#f1f5f9"/>
    <text x="1100" y="245" font-size="18" fill="#0f172a" text-anchor="middle">要対応</text>
    <rect x="1004" y="280" width="192" height="56" rx="10" fill="#f1f5f9"/>
    <text x="1100" y="315" font-size="18" fill="#0f172a" text-anchor="middle">通知フィード</text>
    <rect x="1004" y="350" width="192" height="56" rx="10" fill="#f1f5f9"/>
    <text x="1100" y="385" font-size="18" fill="#0f172a" text-anchor="middle">未来レーダー</text>
    <rect x="1004" y="420" width="192" height="56" rx="10" fill="#f1f5f9"/>
    <text x="1100" y="455" font-size="18" fill="#0f172a" text-anchor="middle">指示ボックス</text>
  </g>

  <!-- Arrows -->
  <line x1="318" y1="330" x2="348" y2="330" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="628" y1="330" x2="658" y2="330" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="948" y1="330" x2="978" y2="330" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Feedback arrow: platform instructions back to ledger -->
  <path d="M 1100 520 L 1100 540 L 489 540 L 489 524" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="795" y="534" font-size="15" fill="#64748b" text-anchor="middle">指示は台帳に記録される</text>

  <!-- Base layer -->
  <g>
    <rect x="64" y="580" width="1152" height="116" rx="16" fill="#0f172a"/>
    <text x="96" y="624" font-size="22" font-weight="700" fill="#ffffff">ローカル基盤 — ノートPC 1台（Core Ultra 5 228V / Arc 内蔵GPU / 32GB 共有メモリ）</text>
    <text x="96" y="660" font-size="18" fill="#cbd5e1">OpenVINO Model Server + Qwen3.8-27B 常時稼働 ・ watchdog（5分間隔で死活監視・自動復旧） ・ モード切替（Qwen / LM Studio / 全部ストップ）</text>
  </g>
</svg>
